<ion-content class="content-login">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-badge">
        <ion-icon name="shield-checkmark" class="shield-icon"></ion-icon>
      </div>

      <h1>PANEL ADMINISTRATIVO</h1>
      <p class="subtitle">Acceso exclusivo para administradores de la plataforma</p>

      <form (ngSubmit)="ingresar()" class="login-form">
        <div class="field-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrap">
            <ion-icon name="mail-outline"></ion-icon>
            <input
              id="email"
              type="email"
              [(ngModel)]="emailInput"
              name="email"
              placeholder="admin@smokeshop.com"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input
              id="password"
              type="password"
              [(ngModel)]="passInput"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        @if (mensajeError) {
          <div class="error-toast">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <span>{{ mensajeError }}</span>
          </div>
        }

        <div class="admin-hint">
          <span>💡 <em>Credenciales por defecto: <strong>admin@smokeshop.com</strong> / <strong>admin123</strong></em></span>
        </div>

        <button type="submit" class="btn-login" [disabled]="cargando">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <span>Iniciar Sesión Admin</span>
          }
        </button>
      </form>

      <div class="back-link">
        <a routerLink="/home">← Volver al sitio público</a>
      </div>
    </div>
  </div>
</ion-content>

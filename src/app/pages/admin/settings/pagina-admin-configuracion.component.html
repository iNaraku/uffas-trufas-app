<app-encabezado-admin rutaActiva="/admin/settings"></app-encabezado-admin>

<ion-content class="content-admin ion-padding">
  <div class="admin-wrapper">

    <!-- PAGE HEADER -->
    <div class="page-header-native">
      <div class="header-text">
        <h2>Configuración General de la Tienda</h2>
        <p>Ajusta el nombre, números de contacto para WhatsApp, dirección y enlaces a redes sociales.</p>
      </div>
    </div>

    @if (guardadoExitoso) {
      <div class="success-alert-native">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <span>¡Información del sitio actualizada exitosamente!</span>
      </div>
    }

    <ion-card class="native-settings-card">
      <ion-card-content class="card-content-native">
        <form (ngSubmit)="guardar()" class="admin-form-native">
          <ion-list [inset]="true" class="form-list-native ion-no-padding">
            <ion-item class="form-item-native">
              <ion-input
                label="Nombre Comercial *"
                labelPlacement="floating"
                [(ngModel)]="formConfig.nombreTienda"
                name="nombreTienda"
                required
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Eslogan / Subtítulo *"
                labelPlacement="floating"
                [(ngModel)]="formConfig.eslogan"
                name="eslogan"
                required
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Teléfono de Atención WhatsApp *"
                labelPlacement="floating"
                [(ngModel)]="formConfig.telefonoWhatsapp"
                name="telefonoWhatsapp"
                required
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Horarios de Atención"
                labelPlacement="floating"
                [(ngModel)]="formConfig.horarios"
                name="horarios"
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Dirección Física de la Tienda"
                labelPlacement="floating"
                [(ngModel)]="formConfig.direccion"
                name="direccion"
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Usuario Instagram (ej. @rebelsmokeshop)"
                labelPlacement="floating"
                [(ngModel)]="formConfig.instagram"
                name="instagram"
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native">
              <ion-input
                label="Página Facebook (ej. /rebelsmokeshop)"
                labelPlacement="floating"
                [(ngModel)]="formConfig.facebook"
                name="facebook"
              ></ion-input>
            </ion-item>

            <ion-item class="form-item-native" lines="none">
              <ion-textarea
                label="Mensaje de Bienvenida en Footer"
                labelPlacement="floating"
                [(ngModel)]="formConfig.mensajeBienvenida"
                name="mensajeBienvenida"
                rows="2"
              ></ion-textarea>
            </ion-item>
          </ion-list>

          <ion-button type="submit" expand="block" shape="round" color="warning" class="btn-save-settings-native">
            <ion-icon name="save-outline" slot="start"></ion-icon>
            Guardar Configuración
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<div class="modal-backdrop" (click)="cerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="cerrar()">&times;</button>

    <div class="modal-header">
      <div class="lock-circle">
        <ion-icon name="lock-closed"></ion-icon>
      </div>
      <h2>Acceso Catálogo Privado 🔒</h2>
      <p>Ingresa tu PIN de usuario autorizado para desbloquear bongs premium, extractos y productos exclusivos.</p>
    </div>

    <form (ngSubmit)="validar()" class="modal-form">
      <div class="input-group">
        <label for="pinInput">PIN de Seguridad</label>
        <input
          id="pinInput"
          type="password"
          [(ngModel)]="pinIngresado"
          name="pinInput"
          placeholder="Ej: 1234"
          maxlength="10"
          autocomplete="off"
          autofocus
          required
        />
      </div>

      @if (servicioPin.mensajeError()) {
        <div class="error-box">
          <ion-icon name="alert-circle-outline"></ion-icon>
          <span>{{ servicioPin.mensajeError() }}</span>
        </div>
      }

      <div class="hint-box">
        <span>💡 <em>PIN de prueba: <strong>1234</strong> o <strong>7777</strong></em></span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="cargando || !pinIngresado">
          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <span>Desbloquear</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
